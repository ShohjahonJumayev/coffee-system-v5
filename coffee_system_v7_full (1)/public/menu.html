<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7c4a2d"><title>Меню кофейни</title><link rel="stylesheet" href="menu.css"></head>
<body>
<header class="menu-head"><div class="menu-logo">☕</div><div><h1>Меню кофейни</h1><p id="branchName">Выберите напитки и отправьте заказ</p></div></header>
<main class="menu-main">
  <div class="branch-box"><label>Филиал</label><select id="branchSelect"></select></div>
  <div id="categories" class="chips"></div>
  <div id="products" class="menu-grid"></div>
</main>
<div class="cart-bar"><div><small>Итого</small><b><span id="total">0</span> сум</b></div><button id="openCart">Корзина · <span id="count">0</span></button></div>
<div id="drawer" class="drawer hide"><div class="drawer-card"><div class="drawer-head"><h2>Ваш заказ</h2><button id="closeCart">×</button></div><div id="cartList"></div><div class="total-row"><span>Итого</span><b><span id="drawerTotal">0</span> сум</b></div><input id="customerName" placeholder="Ваше имя"><input id="customerPhone" type="tel" placeholder="Телефон"><button id="sendOrder" class="send">Отправить заказ</button><p class="note">Оплата производится в кофейне при получении.</p></div></div>
<div id="success" class="success-modal hide"><div><div class="big">✅</div><h2>Заказ отправлен!</h2><p id="successText"></p><button onclick="location.reload()">Готово</button></div></div>
<script src="menu.js"></script></body></html>
